<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crime Detection</title>
    <link rel="icon" href="/static/favicon1.ico" type="image/x-icon">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            text-align: center;
            background: url('https://blog.ipleaders.in/wp-content/uploads/2021/07/Cybercrime-1.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(6px);
            z-index: -2; /* Background overlay */
        }
        body::after {
            content: '';
            position: fixed;
            top: 100px; /* Start below the title */
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0, 204, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 204, 255, 0.5);
            animation: scan 6s linear infinite;
            animation-delay: 1s; /* Delay to ensure title is visible first */
            z-index: -1; /* Scan-line above background but below content */
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 100px; } /* Start below the title */
            100% { top: 100%; }
        }
        .radar-pulse {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(0, 204, 255, 0.3) 0%, transparent 70%);
            animation: radarPulse 4s ease-out infinite;
            z-index: -3; /* Below everything */
            transform: translate(-50%, -50%);
        }
        @keyframes radarPulse {
            0% { width: 0; height: 0; opacity: 0.5; }
            50% { width: 600px; height: 600px; opacity: 0.2; }
            100% { width: 800px; height: 800px; opacity: 0; }
        }
        .content {
            position: relative;
            z-index: 1; /* Ensures content stays above scan-line and background */
        }
        h1 {
            color: #00ccff;
            text-shadow: 0 0 15px rgba(0, 204, 255, 0.8);
            font-size: 2.5em;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            z-index: 1;
            padding: 0; /* Remove padding */
            border: none; /* No borders */
            box-shadow: none; /* No shadow */
        }
        #video-preview, #camera-preview {
            width: 80%;
            max-width: 600px;
            margin: 20px auto;
            display: none;
            border: 3px solid #00ccff;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 204, 255, 0.5);
            background: rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
        }
        .button-group {
            margin: 20px auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.25);
            transition: left 0.4s ease;
        }
        button:hover::after {
            left: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 204, 255, 0.6);
        }
        .upload-btn {
            background-color: #007bff;
            color: white;
        }
        .upload-btn:hover {
            background-color: #0056b3;
        }
        .camera-btn {
            background-color: #ff5733;
            color: white;
        }
        .camera-btn:hover {
            background-color: #c94125;
        }
        .stop-btn {
            background-color: #dc3545;
            color: white;
            display: none;
        }
        .stop-btn:hover {
            background-color: #a71d2a;
        }
        .result {
            font-size: 18px;
            margin: 20px auto;
            color: #00ccff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 204, 255, 0.5);
            background-color: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 8px;
            display: inline-block;
            border: 2px solid #00ccff;
            position: relative;
            animation: alertPulse 1.5s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes alertPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 204, 255, 0.3); }
            50% { box-shadow: 0 0 20px rgba(0, 204, 255, 0.6); }
        }
        input[type="file"] {
            display: block;
            margin: 20px auto;
            padding: 10px;
            background-color: rgba(51, 51, 51, 0.85);
            color: #e0e0e0;
            border: 2px solid #00ccff;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1;
        }
        input[type="file"]::file-selector-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #0056b3;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            button {
                padding: 10px 16px;
                font-size: 14px;
            }
            #video-preview, #camera-preview {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="radar-pulse"></div>
    <div class="content">
        <h1>AI-Driven Crime Detection</h1>

        <!-- Video Preview for Uploaded Files -->
        <video id="video-preview" controls></video>

        <!-- Real-Time Camera Preview -->
        <img id="camera-preview" src="" style="display:none; width: 80%; max-width: 600px;" alt="Live Camera Feed"/>

        <!-- Upload File -->
        <input type="file" id="videoFile" accept="video/*">
        <div class="button-group">
            <button class="upload-btn" onclick="uploadVideo()">Upload & Detect</button>
            <button class="camera-btn" onclick="startRealTime()">Detect in Real-Time</button>
            <button class="stop-btn" id="stopButton" onclick="stopRealTime()">Stop</button>
        </div>

        <!-- Display Result -->
        <p class="result" id="resultText">Detection result will appear here...</p>
    </div>

    <script>
        function uploadVideo() {
            const fileInput = document.getElementById('videoFile');
            if (!fileInput.files.length) {
                alert("Please select a video file!");
                return;
            }
    
            clearPreview(); // Clear previous results
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);
    
            document.getElementById("resultText").innerText = "Processing video, please wait...";
    
            fetch('/upload-video/', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                document.getElementById('resultText').innerText = `🔍 ${data.message} - ${data.crime_type}`;
                
                // Show video preview AFTER detection
                const preview = document.getElementById("video-preview");
                const fileURL = URL.createObjectURL(file);
                preview.src = fileURL;
                preview.style.display = "block";
            });
        }
    
        function startRealTime() {
            clearPreview();  // Clear previous preview
            document.getElementById("resultText").innerText = "🔍 Detecting crime in real-time...";
            document.getElementById("stopButton").style.display = "inline"; // Show stop button
    
            // Show live camera preview while recording
            const cameraPreview = document.getElementById("camera-preview");
            cameraPreview.src = "/camera-feed/"; // This will show the live feed from the camera
            cameraPreview.style.display = "block";
    
            setTimeout(() => {
                fetch('/detect-real-time/')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('resultText').innerText = `🚨 ${data.message} - ${data.crime_type}`;
    
                    // Hide the live preview after detection
                    cameraPreview.style.display = "none";
                    document.getElementById("stopButton").style.display = "none";
    
                    // ✅ Show recorded real-time video after processing
                    if (data.video_path) {
                        const preview = document.getElementById("video-preview");
                        preview.src = data.video_path; // Replace with the processed video
                        preview.style.display = "block";
                        preview.load();  // Force reload of the new video file
                    }
                });
            }, 10000); // Wait for 10 seconds before detecting
        }
    
        function stopRealTime() {
            document.getElementById("stopButton").style.display = "none"; // Hide stop button when clicked
            document.getElementById("camera-preview").style.display = "none"; // Hide camera preview
        }
    
        function clearPreview() {
            document.getElementById("video-preview").src = "";
            document.getElementById("video-preview").style.display = "none";
            document.getElementById("camera-preview").src = "";
            document.getElementById("camera-preview").style.display = "none";
            document.getElementById("resultText").innerText = "Detection result will appear here...";
        }
    </script>
    
</body>
</html>
